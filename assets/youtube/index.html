<!DOCTYPE html>
<!--
  Headless YouTube playback surface.
  This document intentionally renders NO user interface: no controls, no
  buttons, no menus, no progress bar. It only hosts the YouTube IFrame
  Player. Every control is rendered by Flutter on top of the WebView.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>YouTube Playback Engine</title>
    <style>
      /*
       * Only enough CSS to: fill the page, hide overflow, paint a black
       * background, size responsively, and disable selection / long press /
       * context-menu affordances. Nothing decorative.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }

      #player {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        pointer-events: none;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script src="player.js"></script>
  </body>
</html>
