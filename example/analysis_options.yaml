analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    unnecessary_primary_constructor_body: true
    use_declaring_parameters: true
    use_null_aware_elements: true
    # Re-flags every class without a constructor once migrated.
    use_primary_constructors: false
