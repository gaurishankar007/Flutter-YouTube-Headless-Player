name: youtube_headless_player
description: >-
  A headless YouTube player whose UI is built entirely in Flutter. Use the
  ready-made YouTube-style controls or build your own.
version: 0.2.0
homepage: https://github.com/gaurishankar007/Flutter-YouTube-Headless-Player
repository: https://github.com/gaurishankar007/Flutter-YouTube-Headless-Player
documentation: https://github.com/gaurishankar007/Flutter-YouTube-Headless-Player
issue_tracker: https://github.com/gaurishankar007/Flutter-YouTube-Headless-Player/issues

platforms:
  android:
  ios:
  macos:
  web:

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  meta: ^1.19.0
  web: ^1.1.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^27.0.0

flutter:
  assets:
    - assets/youtube/
